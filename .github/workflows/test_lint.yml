name: CI Pipeline

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting...
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1


  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner is thrown away after the job; removing the builder in
          # the post step only cost time (7-30s).
          cleanup: false

      - name: Create CI .env from example
        run: |
          echo "Creating .env file for CI..."
          if [ -f env.example ]; then
            echo "Found env.example, copying to .env"
            cp env.example .env
            # Override with CI-specific values
            sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-for-testing-only/' .env
            sed -i 's/^DEBUG=.*/DEBUG=True/' .env
            sed -i 's/^DB_NAME=.*/DB_NAME=itqan/' .env
            sed -i 's/^DB_USER=.*/DB_USER=postgres/' .env
            sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
            sed -i 's/^DB_HOST=.*/DB_HOST=postgres/' .env
            sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
            sed -i 's|^REDIS_URL=.*|REDIS_URL=redis://redis:6379/0|' .env
            sed -i 's|^CELERY_BROKER_URL=.*|CELERY_BROKER_URL=redis://redis:6379/0|' .env
            sed -i 's|^CELERY_RESULT_BACKEND=.*|CELERY_RESULT_BACKEND=redis://redis:6379/0|' .env
          else
            echo "No env.example found; generating minimal CI .env"
            echo "SECRET_KEY=ci-secret-key-for-testing-only" > .env
            echo "DEBUG=True" >> .env
            echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
            echo "DB_NAME=itqan" >> .env
            echo "DB_USER=postgres" >> .env
            echo "DB_PASSWORD=postgres" >> .env
            echo "DB_HOST=postgres" >> .env
            echo "DB_PORT=5432" >> .env
            echo "REDIS_URL=redis://redis:6379/0" >> .env
            echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
            echo "CELERY_RESULT_BACKEND=redis://redis:6379/0" >> .env
          fi
          echo "Verifying .env file exists:"
          ls -la .env
          echo "Contents of .env:"
          cat .env

      # Start the databases now so they boot while the image builds.
      - name: Start services
        run: docker compose -f docker-compose.local.yml up -d --no-build postgres audit-postgres redis

      - name: Build Django image with layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          build-args: DEPENDENCY_GROUP=dev
          load: true
          tags: itqan-cms-backend-django:latest
          cache-from: type=gha,scope=django-dev
          cache-to: type=gha,scope=django-dev,mode=max,compression=zstd

      # --wait blocks until the healthchecks pass, so the runs below can use
      # --no-deps and skip starting rabbitmq (CI points Celery at redis).
      - name: Wait for services
        run: docker compose -f docker-compose.local.yml up -d --wait --no-build postgres audit-postgres redis

      # One container for all three: each `compose run` costs ~5s to create
      # the container plus Django start-up.
      # .mo files are gitignored, so the checkout has none. Tests that assert on
      # translated output need the catalog compiled first, same as the deploy does.
      - name: Check DB Migrations and Localization, Compile Translations
        run: |
          docker compose -f docker-compose.local.yml run --rm --no-deps django bash -euo pipefail -c '
            echo "::group::Check DB Migrations"
            uv run python manage.py makemigrations --check
            echo "::endgroup::"
            echo "::group::Check Localization"
            uv run manage.py extendedmakemessages --no-location --no-wrap --locale=ar --no-fuzzy-matching --keep-header --check
            echo "::endgroup::"
            echo "::group::Compile Translations"
            uv run python manage.py compilemessages --locale ar
            echo "::endgroup::"
          '

      # pytest builds its own test databases by running every migration (both
      # the default and audit DBs), so no separate migrate step is needed.
      # -n auto runs one xdist worker per physical core (2 on the 4-vCPU
      # runner), each with its own test DB. -n logical (4 workers) was slower.
      - name: Run Django Tests
        run: docker compose -f docker-compose.local.yml run --rm --no-deps django uv run pytest -n auto

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down
